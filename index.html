<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>慈愛動物醫院｜Google 評論分析系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;600;700;900&family=Noto+Sans+TC:wght@200;300;400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════
   慈愛動物醫院 CIS（2026）
   主紅 PANTONE 186C  #CF102D   愛與守護
   金   PANTONE 7550C #C2811E   溫暖關懷
   鮮橙 V5            #F3661F   親和活力
   深棕 PANTONE 175C  #5D2F2A   專業醫療
   輔色 #F4F4F4 / #817776 / #FDE4C4 / #F04145
   字體 Noto Sans（CIS 指定 NotoSansHK 同一家族）
   ══════════════════════════════════════════════════════════ */
:root{
  /* CIS 主色 */
  --brand:#CF102D;        /* PANTONE 186C　只用於重點與警示，不當底色 */
  --gold:#B8842A;         /* PANTONE 7550C　壓深一階，避免刺眼 */
  --orange:#D9601F;       /* V5 鮮橙　壓深一階 */
  --maroon:#4A2420;       /* PANTONE 175C　壓深，作為主要 chrome */
  --maroon-dk:#2E1512;    /* 最深，報頭底色 */
  --maroon-lt:#6B3A33;
  --cream:#F3E2C9; --cream-soft:#FBF6EE; --grey:#7D7370;
  /* 功能色：CIS 無綠，僅用於數據狀態，不用在品牌元素 */
  --pos:#2A5F47; --pos-soft:#EDF3EF;
  /* 紙面 */
  --page:#F7F5F2; --panel:#FFFFFF; --panel-2:#FBF9F7;
  --line:#E2DAD2; --line-soft:#EFE9E3; --line-dk:#CDBFB4;
  --ink:#22140F; --ink-2:#5E504A; --ink-3:#988B84;
  --rule:1px solid var(--line);
  /* 字體 */
  --serif:'Noto Serif TC',Georgia,'Songti TC',serif;
  --sans:'Noto Sans TC',system-ui,-apple-system,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--page);color:var(--ink);
  font-weight:400;line-height:1.65;-webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums}
a{color:var(--maroon)}
::selection{background:var(--cream)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* ───────── 報頭 ───────── */
.masthead{background:var(--maroon-dk);position:sticky;top:0;z-index:120;
  box-shadow:inset 0 -1px 0 rgba(255,255,255,.07)}
.masthead::after{content:'';display:block;height:3px;
  background:linear-gradient(90deg,var(--brand) 0 34%,var(--gold) 34% 100%)}
.mh-in{max-width:1560px;margin:0 auto;padding:20px 34px;display:flex;align-items:center;gap:20px}
.mh-mark{width:54px;height:54px;background:#fff;border-radius:2px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center}
.mh-mark img{display:block;width:54px;height:54px;object-fit:contain}
.mh-lock{flex:1;min-width:0}
.mh-lock h1{font-family:var(--serif);font-size:1.52rem;font-weight:500;color:#fff;
  letter-spacing:7px;line-height:1.2}
.mh-lock .en{font-family:var(--sans);font-size:.52rem;font-weight:600;color:#C79A4E;
  letter-spacing:3.6px;margin-top:5px}
.mh-lock .sys{display:block;font-size:.63rem;font-weight:400;color:rgba(255,255,255,.5);
  letter-spacing:3px;margin-top:7px;padding-top:7px;
  border-top:1px solid rgba(255,255,255,.12);max-width:15em}
.mh-meta{text-align:right;flex-shrink:0}
.mh-meta .lbl{font-size:.56rem;font-weight:700;letter-spacing:2px;color:rgba(255,255,255,.5)}
.mh-meta .val{font-family:var(--serif);font-size:.92rem;font-weight:500;color:#fff;
  letter-spacing:.5px;margin-top:3px}
.mh-meta .val b{font-weight:900;color:var(--cream)}
.burger{display:none;flex-direction:column;gap:5px;width:38px;height:38px;background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.22);border-radius:3px;cursor:pointer;align-items:center;justify-content:center}
.burger span{display:block;width:18px;height:1.5px;background:#fff;transition:.25s}
.burger.on span:nth-child(1){transform:translateY(6.5px) rotate(45deg)}
.burger.on span:nth-child(2){opacity:0}
.burger.on span:nth-child(3){transform:translateY(-6.5px) rotate(-45deg)}

/* ───────── 狀態列 ───────── */
.statbar{background:#fff;border-bottom:var(--rule);position:sticky;top:85px;z-index:110}
.sb-in{max-width:1560px;margin:0 auto;padding:0 30px;display:flex;align-items:stretch;gap:0;overflow-x:auto}
.sb-cell{padding:11px 26px 11px 0;margin-right:26px;border-right:var(--rule);white-space:nowrap}
.sb-cell:last-child{border-right:none;margin-right:0;padding-right:0}
.sb-k{font-size:.55rem;font-weight:700;letter-spacing:1.8px;color:var(--ink-3)}
.sb-v{font-family:var(--serif);font-size:1.04rem;font-weight:600;color:var(--ink);
  letter-spacing:.3px;margin-top:2px}
.sb-v small{font-size:.62rem;font-weight:500;color:var(--ink-2);letter-spacing:0;margin-left:4px}
.sb-act{margin-left:auto;display:flex;align-items:center;gap:8px;padding:8px 0}

/* ───────── 版面 ───────── */
.wrap{max-width:1560px;margin:0 auto;display:flex;min-height:calc(100vh - 130px)}
.nav{width:230px;min-width:230px;background:#fff;border-right:var(--rule);
  padding:20px 0 40px;position:sticky;top:130px;height:calc(100vh - 130px);overflow-y:auto}
.main{flex:1;min-width:0;padding:36px 40px 72px}
.nav-sec{font-size:.54rem;font-weight:700;letter-spacing:2.8px;color:var(--ink-3);padding:18px 24px 8px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 22px;cursor:pointer;
  border-left:3px solid transparent;transition:background .15s}
.nav-item:hover{background:var(--panel-2)}
.nav-item.on{background:var(--cream-soft);border-left-color:var(--brand)}
.nav-item .nm{font-size:.82rem;font-weight:500;flex:1;min-width:0;letter-spacing:.6px}
.nav-item.on .nm{font-weight:700;color:var(--maroon)}
.nav-item .sub{font-size:.62rem;color:var(--ink-3);font-weight:400;margin-top:1px}
.nav-item .ct{font-size:.6rem;font-weight:700;color:var(--ink-3);background:var(--page);
  border:var(--rule);border-radius:2px;padding:1px 6px}
.nav-bar{width:3px;height:15px;border-radius:1px;flex-shrink:0}
.nav-rule{height:1px;background:var(--line-soft);margin:12px 22px}

/* ───────── 標題 ───────── */
.page-hd{margin-bottom:32px}
.page-eyebrow{font-size:.56rem;font-weight:700;letter-spacing:3px;color:var(--brand);
  margin-bottom:10px;display:flex;align-items:center;gap:9px}
.page-eyebrow::after{content:'';width:34px;height:1px;background:var(--line-dk)}
.page-hd h2{font-family:var(--serif);font-size:1.96rem;font-weight:500;letter-spacing:3px;
  color:var(--ink);line-height:1.35}
.page-hd h2 b{font-weight:700}
.page-hd .dek{font-size:.81rem;color:var(--ink-2);margin-top:12px;max-width:74ch;line-height:1.9}
.sect{margin:44px 0 18px;display:flex;align-items:baseline;gap:14px}
.sect h3{font-family:var(--sans);font-size:.66rem;font-weight:700;letter-spacing:3px;
  color:var(--maroon);white-space:nowrap}
.sect .hint{font-size:.68rem;color:var(--ink-3);font-weight:400;letter-spacing:0}
.sect::after{content:'';flex:1;height:1px;background:var(--line-dk);opacity:.6}

/* ───────── 數據磚 ───────── */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);
  border:var(--rule);margin-bottom:4px}
.kpi{background:#fff;padding:24px 24px 22px;position:relative}
.kpi::before{content:'';position:absolute;left:24px;right:24px;top:0;height:2px;background:var(--line)}
.kpi.k1::before{background:var(--brand)}
.kpi.k2::before{background:var(--pos)}
.kpi.k3::before{background:var(--gold)}
.kpi.k4::before{background:var(--orange)}
.kpi .k{font-size:.57rem;font-weight:700;letter-spacing:2.2px;color:var(--ink-3)}
.kpi .v{font-family:var(--serif);font-size:2.4rem;font-weight:600;line-height:1.05;
  margin-top:13px;letter-spacing:0;color:var(--ink)}
.kpi.k1 .v{color:var(--brand)}.kpi.k2 .v{color:var(--pos)}.kpi.k3 .v{color:var(--gold)}.kpi.k4 .v{color:var(--orange)}
.kpi .v small{font-family:var(--sans);font-size:.82rem;font-weight:500;color:var(--ink-2)}
.kpi .n{font-size:.67rem;color:var(--ink-2);margin-top:10px;line-height:1.65}

/* ───────── 刻度尺（招牌視覺） ───────── */
.ruler{background:#fff;border:var(--rule);padding:30px 34px 24px;margin-bottom:4px}
.ruler-hd{display:flex;justify-content:space-between;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.ruler-hd .t{font-family:var(--sans);font-size:.66rem;font-weight:700;letter-spacing:3px;color:var(--maroon)}
.ruler-hd .d{font-size:.68rem;color:var(--ink-3)}
.rr{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:16px;margin-bottom:6px}
.rr-lbl{text-align:right}
.rr-lbl .g{font-family:var(--serif);font-size:.8rem;font-weight:600;color:var(--ink)}
.rr-lbl .a{font-size:.62rem;color:var(--ink-3);font-variant-numeric:tabular-nums}
.rr-track{position:relative;height:42px}
.rr-track::before{content:'';position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line)}
.pin{position:absolute;top:50%;transform:translate(-50%,-50%);width:13px;height:13px;border-radius:50%;
  border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.12);cursor:default}
.pin.wide{width:15px;height:15px}
.pin-cap{position:absolute;top:50%;transform:translate(-50%,-125%);font-size:.58rem;font-weight:700;
  color:var(--ink-2);white-space:nowrap;pointer-events:none}
.pin-cap.dn{transform:translate(-50%,28%)}
.ruler-axis{display:grid;grid-template-columns:96px 1fr;gap:16px;margin-top:6px}
.axis{position:relative;height:22px;border-top:1px solid var(--line)}
.tick{position:absolute;top:0;transform:translateX(-50%);font-size:.6rem;color:var(--ink-3);
  padding-top:5px;font-variant-numeric:tabular-nums}
.tick::before{content:'';position:absolute;left:50%;top:0;width:1px;height:4px;background:var(--line)}
.avgline{position:absolute;top:-4px;bottom:0;width:1px;background:var(--brand);opacity:.5}

/* ───────── 表格 ───────── */
.tbl{background:#fff;border:var(--rule);overflow-x:auto;margin-bottom:4px}
.tbl table{width:100%;border-collapse:collapse;min-width:600px}
.tbl th{padding:13px 16px;text-align:left;font-size:.56rem;font-weight:700;letter-spacing:2px;
  color:var(--ink-3);background:var(--panel-2);border-bottom:1px solid var(--line-dk);white-space:nowrap}
.tbl td{padding:14px 16px;font-size:.81rem;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl tbody tr:hover td{background:var(--panel-2)}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.tbl .nm{font-weight:700}
.tbl .sm{font-size:.68rem;color:var(--ink-3);font-weight:400}

/* ───────── 標籤 ───────── */
.tag{display:inline-block;font-size:.6rem;font-weight:700;letter-spacing:.6px;padding:2px 8px;border-radius:2px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
.badge{display:inline-block;font-size:.6rem;font-weight:700;padding:2px 9px;border-radius:2px;white-space:nowrap}
.badge.pos{background:var(--pos-soft);color:var(--pos);border:1px solid #C6DCCE}
.badge.neu{background:#FAF1DE;color:#7A4E12;border:1px solid #E7CFA2}
.badge.neg{background:#FCEBED;color:#9A0F22;border:1px solid #F0BCC3}
.badge.info{background:var(--cream-soft);color:var(--maroon);border:1px solid var(--cream)}

/* ───────── 卡片 ───────── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1px;
  background:var(--line);border:var(--rule);margin-bottom:4px}
.card{background:#fff;padding:22px 24px;cursor:pointer;transition:background .15s;position:relative}
.card:hover{background:var(--panel-2)}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent}
.card:hover::before{background:var(--brand)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.card-nm{font-family:var(--serif);font-size:1.1rem;font-weight:600;letter-spacing:1.5px}
.card-dir{font-size:.66rem;color:var(--maroon);font-weight:500;margin-top:3px}
.card-ad{font-size:.65rem;color:var(--ink-3);margin-top:5px;line-height:1.6}
.card-sc{text-align:right;flex-shrink:0}
.card-sc .n{font-family:var(--serif);font-size:1.86rem;font-weight:600;line-height:1;letter-spacing:0}
.card-sc .st{font-size:.6rem;letter-spacing:1px;color:var(--gold);margin-bottom:2px}
.card-sc .c{font-size:.6rem;color:var(--ink-3);margin-top:3px}
.meter{height:5px;background:var(--page);display:flex;margin-top:14px;border-radius:1px;overflow:hidden}
.meter i{display:block;height:100%}
.meter-lg{display:flex;gap:12px;font-size:.6rem;font-weight:700;margin-top:6px}
.card-ft{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;
  padding-top:12px;border-top:1px solid var(--line-soft)}

/* ───────── 按鈕 / 表單 ───────── */
.btn{font-family:var(--sans);font-size:.73rem;font-weight:700;letter-spacing:1.4px;padding:9px 20px;
  border-radius:1px;cursor:pointer;border:1px solid transparent;transition:.15s;white-space:nowrap}
.btn-fill{background:var(--maroon);color:#fff}
.btn-fill:hover{background:var(--maroon-dk)}
.btn-gold{background:transparent;color:var(--maroon);border-color:var(--line-dk)}
.btn-gold:hover{border-color:var(--gold);color:var(--gold)}
.btn-red{background:var(--brand);color:#fff}
.btn-red:hover{background:#A80D24}
.btn-line{background:#fff;color:var(--maroon);border-color:var(--line)}
.btn-line:hover{border-color:var(--maroon)}
.btn-sm{font-size:.66rem;padding:5px 12px}
.btn:disabled{background:#EDE9E5;color:var(--ink-3);border-color:transparent;cursor:not-allowed}
.fld{font-family:inherit;font-size:.76rem;padding:8px 12px;border:1px solid var(--line);
  border-radius:2px;background:#fff;color:var(--ink)}
.fld:focus{outline:none;border-color:var(--maroon)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters input.fld{flex:1;min-width:190px}
.link{font-size:.7rem;color:var(--maroon);text-decoration:none;font-weight:500;border-bottom:1px solid var(--cream)}
.link:hover{border-bottom-color:var(--maroon)}

/* ───────── 訊息框 ───────── */
.note{border:1px solid var(--line);border-left:3px solid var(--gold);background:#fff;
  padding:15px 18px;font-size:.76rem;line-height:1.8;color:var(--ink-2);margin-bottom:20px}
.note strong{color:var(--ink);font-weight:700}
.note.warn{border-left-color:var(--brand);background:#FEF8F9}
.note.ok{border-left-color:var(--pos);background:var(--pos-soft)}
.note code{background:var(--page);padding:1px 5px;border-radius:2px;font-size:.72rem}
.panel{background:#fff;border:var(--rule);padding:24px 26px;margin-bottom:4px}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);
  border:var(--rule);margin-bottom:4px}
.tri>div{background:#fff;padding:20px 22px}
.tri h4{font-size:.6rem;font-weight:700;letter-spacing:2.6px;padding-bottom:10px;margin-bottom:13px;
  border-bottom:2px solid}
.tri ol{list-style:none;counter-reset:t}
.tri li{counter-increment:t;font-size:.76rem;line-height:1.7;padding:7px 0 7px 22px;position:relative;
  border-bottom:1px solid var(--line-soft)}
.tri li:last-child{border-bottom:none}
.tri li::before{content:counter(t);position:absolute;left:0;top:7px;font-size:.62rem;font-weight:900;
  width:15px;text-align:center}
.tri .p h4{color:var(--pos);border-color:#C6DCCE}.tri .p li::before{color:var(--pos)}
.tri .c h4{color:#9A0F22;border-color:#F0BCC3}.tri .c li::before{color:#9A0F22}
.tri .a h4{color:var(--maroon);border-color:var(--cream)}.tri .a li::before{color:var(--maroon)}

/* ───────── 圖表 ───────── */
.charts{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:4px}
.chart{background:#fff;border:var(--rule);padding:22px 24px}
.chart h4{font-size:.6rem;font-weight:700;letter-spacing:2px;color:var(--ink-3);
  padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:16px}

/* ───────── 彈窗 ───────── */
.ov{display:none;position:fixed;inset:0;background:rgba(42,26,22,.62);z-index:300;
  align-items:center;justify-content:center;backdrop-filter:blur(3px);padding:20px}
.ov.on{display:flex}
.dlg{background:var(--page);width:100%;max-width:900px;max-height:92vh;display:flex;flex-direction:column;
  border-radius:3px;overflow:hidden;box-shadow:0 30px 70px rgba(42,26,22,.35)}
.dlg-hd{background:var(--maroon-dk);padding:22px 26px;
  display:flex;justify-content:space-between;align-items:flex-start;gap:14px;
  border-bottom:3px solid var(--brand)}
.dlg-hd .t{font-family:var(--serif);font-size:1.2rem;font-weight:500;color:#fff;letter-spacing:2.5px}
.dlg-hd .s{font-size:.7rem;color:var(--cream);margin-top:4px;letter-spacing:.3px}
.dlg-x{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;
  width:30px;height:30px;border-radius:2px;cursor:pointer;font-size:.9rem;flex-shrink:0}
.dlg-x:hover{background:var(--brand);border-color:var(--brand)}
.dlg-bd{padding:22px 24px;overflow-y:auto;flex:1}
.tabs{display:flex;gap:1px;background:var(--line);border:var(--rule);margin-bottom:18px;flex-wrap:wrap}
.tab{background:#fff;padding:8px 16px;font-size:.71rem;font-weight:500;cursor:pointer;color:var(--ink-2);flex:1;text-align:center;white-space:nowrap}
.tab.on{background:var(--maroon);color:#fff;font-weight:700}
.rev{background:#fff;border:var(--rule);border-left-width:3px;padding:15px 17px;margin-bottom:4px}
.rev.positive{border-left-color:var(--pos)}
.rev.neutral{border-left-color:var(--gold)}
.rev.negative{border-left-color:var(--brand)}
.rev-hd{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:9px}
.rev-au{font-size:.83rem;font-weight:700}
.rev-mt{font-size:.63rem;color:var(--ink-3);margin-top:2px}
.rev-rt{text-align:right;flex-shrink:0}
.rev-st{font-size:.76rem;letter-spacing:1px}
.rev-dt{font-size:.62rem;color:var(--ink-3);margin-top:1px}
.rev-tx{font-size:.79rem;line-height:1.85;white-space:pre-wrap;color:var(--ink)}
.rev-an{margin-top:11px;padding-top:10px;border-top:1px solid var(--line-soft);font-size:.71rem;
  color:var(--ink-2);display:flex;gap:8px;flex-wrap:wrap}
.rev-an b{color:var(--ink);font-weight:700}
.kw{display:inline-block;font-size:.74rem;font-weight:700;padding:3px 11px;border-radius:2px;margin:0 5px 5px 0}
.kw.p{background:var(--pos-soft);color:var(--pos);border:1px solid #C6DCCE}
.kw.n{background:#FCEBED;color:#9A0F22;border:1px solid #F0BCC3}
.kw i{font-style:normal;opacity:.65;font-weight:500;font-size:.66rem;margin-left:3px}

/* ───────── 進度 / 載入 ───────── */
.load{display:flex;flex-direction:column;align-items:center;gap:14px;padding:52px 20px}
.spin{width:26px;height:26px;border:2px solid var(--line);border-top-color:var(--brand);
  border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.prog{height:3px;background:var(--line);overflow:hidden;margin:12px 0}
.prog i{display:block;height:100%;background:var(--brand);transition:width .35s}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.66rem;color:var(--ink-3)}
.log{max-height:230px;overflow-y:auto;font-size:.71rem;line-height:1.95;border:var(--rule);
  background:var(--panel-2);padding:11px 14px;margin-top:12px}

.ovl{display:none;position:fixed;inset:0;background:rgba(42,26,22,.45);z-index:115}
.ovl.on{display:block}
.cards-m{display:none}

@media(max-width:1180px){

  var all = [baseSnapshot()].concat(arr);
  all.sort(function(a,b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });

}
function saveSnapshot(snap){
  var arr = [];

    var raw = localStorage.getItem(SNAP_KEY);
    if(raw) arr = JSON.parse(raw) || [];
  }catch(e){}
  arr = arr.filter(function(s){ return s.date !== snap.date; });
  arr.push(snap);

    localStorage.setItem(SNAP_KEY, JSON.stringify(arr));
    return true;
  }catch(e){

}

   ============================================================ */
function renderStars(rating){
  var full=Math.floor(rating), half=(rating-full)>=0.25&&(rating-full)<0.75;
  if((rating-full)>=0.75){full+=1;half=false;}
  var empty=5-full-(half?1:0), s='';
  for(var i=0;i<full;i++)s+='★';
  if(half)s+='⯨';
  for(var j=0;j<empty;j++)s+='☆';
  return s;
}
/* 由星等推估情感比例。這是「估算」，不是實際評論統計；
   實際比例請看院所詳情裡即時抓取的評論。 */
function calcSent(r){
  var pos,neu,neg;
  if(r>=4.8){pos=Math.round(85+(r-4.8)*50);neg=Math.round((5-r)*5);}
  else if(r>=4.5){pos=Math.round(70+(r-4.5)*50);neg=Math.round((5-r)*8);}
  else if(r>=4.0){pos=Math.round(40+(r-4.0)*60);neg=Math.round((5-r)*10);}
  else if(r>=3.0){pos=Math.round((r-3.0)*40);neg=Math.round(20+(4.0-r)*20);}
  else if(r>=2.0){pos=0;neg=Math.round(60+(3.0-r)*30);}
  else{pos=0;neg=95;}
  pos=Math.max(0,Math.min(100,pos));
  neg=Math.max(0,Math.min(100,neg));
  neu=Math.max(0,100-pos-neg);
  return{pos:pos,neu:neu,neg:neg};
}
function rAvg(region){
  var avg=region.clinics.reduce(function(a,c){return a+c.rating;},0)/region.clinics.length;
  var total=region.clinics.reduce(function(a,c){return a+c.count;},0);
  var s=calcSent(avg);
  return{avg:parseFloat(avg.toFixed(2)),total:total,pos:s.pos,neu:s.neu,neg:s.neg};
}
function todayStr(){
  var d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fmtDate(s){ return String(s).replace(/-/g,'/'); }
function esc(s){

}

/* ============================================================
   Proxy API（SerpApi 相容）
   ============================================================ */
function apiUrl(params){
  var qs = Object.keys(params).map(function(k){
    return encodeURIComponent(k)+'='+encodeURIComponent(params[k]);
  }).join('&');
  return proxyBase()+'/search?'+qs;
}
async function apiGet(params){
  if(!hasProxy()) throw new Error('尚未設定 Proxy 位址，請先到「系統設定」填入。');
  var r = await fetch(apiUrl(params), {method:'GET', mode:'cors'});
  var txt = await r.text();
  var d;
  try{ d = JSON.parse(txt); }
  catch(e){ throw new Error('Proxy 回傳的不是 JSON（HTTP '+r.status+'）：'+txt.slice(0,120)); }
  if(!r.ok) throw new Error(d.error || ('Proxy 回應 HTTP '+r.status));
  if(d.error) throw new Error(d.error);
  return d;
}
/* 取單一院所目前評分與評論數 */
async function fetchClinicStats(clinic){
  var d = await apiGet({engine:'google_maps', place_id:clinic.placeId, hl:'zh-tw', gl:'tw'});
  var p = d.place_results || (d.local_results && d.local_results[0]) || null;
  if(!p) throw new Error('查無此地點資料');
  var rating = typeof p.rating === 'number' ? p.rating : null;
  var count  = typeof p.reviews === 'number' ? p.reviews
             : (p.user_ratings_total != null ? Number(p.user_ratings_total) : null);
  if(rating === null || count === null) throw new Error('回傳缺少 rating／reviews 欄位');
  return {rating:rating, count:count, dataId:p.data_id || null, title:p.title || clinic.name};
}
/* 取單一院所評論（最新排序） */
async function fetchClinicReviews(clinic, limit){
  var d;
  try{
    d = await apiGet({engine:'google_maps_reviews', place_id:clinic.placeId, hl:'zh-tw', sort_by:'newestFirst'});
  }catch(e){
    var s = await fetchClinicStats(clinic);
    if(!s.dataId) throw e;
    d = await apiGet({engine:'google_maps_reviews', data_id:s.dataId, hl:'zh-tw', sort_by:'newestFirst'});
  }
  var arr = d.reviews || [];
  return limit ? arr.slice(0, limit) : arr;
}
function reviewText(rv){
  if(rv.snippet) return rv.snippet;
  if(rv.extracted_snippet){
    return rv.extracted_snippet.original || rv.extracted_snippet.translated || '';
  }
  return rv.text || '';
}

/* ============================================================
   即時關鍵字／情感分析（全部由實際評論文字算出）
   ============================================================ */
var POS_WORDS = ['親切','專業','用心','貼心','細心','耐心','溫柔','仔細','詳細','推薦',
  '安心','放心','乾淨','整潔','舒適','有耐心','有愛心','負責','合理','價格合理',
  '感謝','謝謝','救回','康復','好轉','厲害','認真','清楚','解說','態度好'];
var NEG_WORDS = ['等候','等很久','排隊','態度','冷漠','不耐煩','昂貴','很貴','亂收費',
  '誤診','延誤','失望','不專業','敷衍','推銷','髒','異味','停車','沒說明',
  '沒解釋','不清楚','後續','沒回覆','過世','惡化','爭議','退費'];

function countKeywords(texts, words){
  var m = {};
  words.forEach(function(w){
    var n = 0;
    texts.forEach(function(t){ if(t.indexOf(w) > -1) n++; });
    if(n>0) m[w] = n;
  });
  return Object.keys(m).map(function(w){return {word:w,n:m[w]};})
    .sort(function(a,b){return b.n-a.n;});
}
function analyzeReviews(reviews){
  var items = reviews.map(function(rv,i){
    var stars = rv.rating || 0;
    var text  = reviewText(rv);
    var pc = POS_WORDS.filter(function(w){return text.indexOf(w)>-1;});
    var nc = NEG_WORDS.filter(function(w){return text.indexOf(w)>-1;});
    var sent = stars>=4 ? 'positive' : stars===3 ? 'neutral' : 'negative';
    return {i:i, stars:stars, text:text, sentiment:sent, pos:pc, neg:nc, raw:rv};
  });
  var texts = items.map(function(it){return it.text;}).filter(Boolean);
  var pos = items.filter(function(it){return it.sentiment==='positive';}).length;
  var neu = items.filter(function(it){return it.sentiment==='neutral';}).length;
  var neg = items.filter(function(it){return it.sentiment==='negative';}).length;
  var posTexts = items.filter(function(it){return it.stars>=4;}).map(function(it){return it.text;});
  var negTexts = items.filter(function(it){return it.stars<=3;}).map(function(it){return it.text;});
  return {
    items:items, pos:pos, neu:neu, neg:neg, total:items.length,
    posRate: items.length ? Math.round(pos/items.length*100) : 0,
    withText: texts.length,
    posKw: countKeywords(posTexts, POS_WORDS).slice(0,8),
    negKw: countKeywords(negTexts, NEG_WORDS).slice(0,8)
  };
}


/* ══════════════════════════════════════════════════════════
   即時資料層
   ------------------------------------------------------------
   排程器（Cloudflare Worker）每小時掃描一次 Google，把結果存在
   它自己的儲存空間。這裡去把那份結果讀回來。
   所以畫面的新鮮度 = 排程器上次掃描的時間，不是「打開就去問 Google」。
   ══════════════════════════════════════════════════════════ */
var LIVE = null;          /* 成功讀到的即時資料 */
var LIVE_ERR = null;      /* 讀取失敗的原因 */
var LIVE_BUSY = false;

async function loadLive(silent){
  if(!hasWorker()){ LIVE=null; LIVE_ERR=null; return null; }
  if(LIVE_BUSY) return LIVE;
  LIVE_BUSY = true;
  try{
    var r = await fetch(workerBase()+'/data?days=14&key='+encodeURIComponent(SETTINGS.workerKey),
      {method:'GET', mode:'cors'});
    var txt = await r.text();
    var d;
    try{ d = JSON.parse(txt); }
    catch(e){ throw new Error('回傳不是 JSON（HTTP '+r.status+'）'); }
    if(!r.ok || d.error) throw new Error(d.error || ('HTTP '+r.status));
    LIVE = d; LIVE_ERR = null;
    applyLive();
  }catch(e){
    LIVE = null; LIVE_ERR = e.message;
  }finally{
    LIVE_BUSY = false;
  }
  if(!silent) updateHeader();
  return LIVE;
}

/* 把排程器抓到的最新評分覆蓋上去 */
function applyLive(){
  if(!LIVE || !LIVE.stats) return;
  allClinics().forEach(function(c){
    var st = LIVE.stats[c.placeId];
    if(st && typeof st.rating==='number') c.rating = st.rating;
    if(st && typeof st.count ==='number') c.count  = st.count;
  });
}

/* 未回覆負評（來自排程器的追蹤紀錄） */
function pendingList(){
  if(!LIVE || !LIVE.pending) return [];
  var out=[];
  Object.keys(LIVE.pending).forEach(function(cid){
    var c=findClinic(cid); if(!c) return;
    LIVE.pending[cid].forEach(function(rv){
      out.push({clinic:c, rv:rv,
        hours: Math.floor((Date.now()-rv.firstSeen)/3600000)});
    });
  });
  return out.sort(function(a,b){ return b.hours-a.hours; });
}
function recentList(){
  if(!LIVE || !LIVE.recent) return [];
  var out=[];
  Object.keys(LIVE.recent).forEach(function(cid){
    var c=findClinic(cid); if(!c) return;
    LIVE.recent[cid].forEach(function(rv){ out.push({clinic:c, rv:rv}); });
  });
  return out;
}
function dataAge(){
  if(!LIVE || !LIVE.generatedAt) return null;
  var t = new Date(LIVE.generatedAt.replace(' ','T')+':00+08:00');
  var mins = Math.floor((Date.now()-t.getTime())/60000);
  return {mins:mins, at:LIVE.generatedAt};
}

  else if(view==='report')   renderReport(m);

  else if(view==='sync')     renderSync(m);
  else if(view==='settings') renderSettings(m);
  updateHeader();
}

/* ══════════════════════════════════════════════════════════
   招牌視覺：全院評分刻度尺
   把 14 間院所畫在同一條 3.0–5.0 的尺上，依分組分列。
   一眼就看得出總院組整群落在左邊。
   ══════════════════════════════════════════════════════════ */
var RULER_MIN=2.8, RULER_MAX=5.05;
function rpct(r){
  var p=(r-RULER_MIN)/(RULER_MAX-RULER_MIN)*100;
  return Math.max(1.5,Math.min(98.5,p));
}
function renderRuler(){
  var all=allClinics();
  var avg=all.reduce(function(a,c){return a+c.rating;},0)/all.length;
  var h='<div class="ruler"><div class="ruler-hd">'
   +'<div class="t">全院評分刻度尺</div>'
   +'<div class="d">每個圓點是一間院所，依分組分列。虛線為全院平均 '+avg.toFixed(2)+' 分。</div></div>';
  GROUPS.forEach(function(g){
    var a=rAvg(g);
    var cs=g.clinics.slice().sort(function(x,y){return x.rating-y.rating;});
    h+='<div class="rr"><div class="rr-lbl"><div class="g">'+g.name+'</div>'
      +'<div class="a">均 '+a.avg.toFixed(2)+'｜'+g.clinics.length+' 院</div></div>';
    h+='<div class="rr-track">';
    h+='<span class="avgline" style="left:'+rpct(avg)+'%"></span>';
    var lastUp=-99, lastDn=-99;
    cs.forEach(function(c,i){
      var p=rpct(c.rating), up=(i%2===0);
      h+='<span class="pin'+(c.count>=300?' wide':'')+'" style="left:'+p+'%;background:'+g.color+'" '
        +'title="'+esc(c.name)+'：'+c.rating.toFixed(1)+' 分／'+c.count.toLocaleString()+' 則"></span>';
      /* 同一側的名稱太靠近就不標，避免疊字；滑過圓點仍看得到完整資訊 */
      var prev = up ? lastUp : lastDn;
      if(p - prev >= 9){
        h+='<span class="pin-cap'+(up?'':' dn')+'" style="left:'+p+'%">'+esc(c.name)+'</span>';
        if(up) lastUp=p; else lastDn=p;
      }
    });
    h+='</div></div>';
  });
  h+='<div class="ruler-axis"><div></div><div class="axis">';
  [3.0,3.5,4.0,4.5,5.0].forEach(function(t){
    h+='<span class="tick" style="left:'+rpct(t)+'%">'+t.toFixed(1)+'</span>';
  });
  h+='</div></div>';
  h+='<div style="font-size:.64rem;color:var(--ink-3);margin-top:12px;line-height:1.7">'
   +'圓點較大者代表評論數 300 則以上，也就是這個分數影響到較多人的觀感。</div>';
  h+='</div>';
  return h;
}

function applyFilter(){
  var q=(document.getElementById('fq').value||'').trim().toLowerCase();
  var g=document.getElementById('fg').value;
  var c=document.getElementById('fc').value;
  var s=document.getElementById('fs').value;
  var items=allClinics().slice();
  if(q)items=items.filter(function(x){return (x.name+(x.full||'')+x.addr+x.tag+x.city+(x.zone||'')+(x.director||'')+(x.rest||'')).toLowerCase().indexOf(q)>-1;});
  if(g)items=items.filter(function(x){return x.group.id===g;});
  if(c)items=items.filter(function(x){return x.city===c;});
  if(s==='rd')items.sort(function(a,b){return b.rating-a.rating;});
  else if(s==='ra')items.sort(function(a,b){return a.rating-b.rating;});
  else if(s==='cd')items.sort(function(a,b){return b.count-a.count;});
  else if(s==='ca')items.sort(function(a,b){return a.count-b.count;});
  var box=document.getElementById('cardGrid');
  box.innerHTML = items.length ? items.map(clinicCard).join('')
    : '<div style="padding:34px;text-align:center;color:var(--ink-3);font-size:.8rem">找不到符合條件的院所。換個關鍵字或清除篩選。</div>';
}

/* ══════════════════════════════════════════════════════════
   分組頁
   ══════════════════════════════════════════════════════════ */
function renderGroup(el,gid){
  var g=GROUPS.filter(function(x){return x.id===gid;})[0];
  if(!g)return;
  var a=rAvg(g);
  var cs=g.clinics.slice().sort(function(x,y){return x.rating-y.rating;});
  var all=allClinics();
  var allAvg=all.reduce(function(s,c){return s+c.rating;},0)/all.length;
  var tot=all.reduce(function(s,c){return s+c.count;},0);
  var high=g.clinics.filter(function(c){return c.rating>=4.5;});
  var low=g.clinics.filter(function(c){return c.rating<4.3;});
  var loudLow=g.clinics.filter(function(c){return c.count>=200&&c.rating<4.3;});
  var small=g.clinics.filter(function(c){return c.count<50;});
  var loud=g.clinics.slice().sort(function(x,y){return y.count-x.count;})[0];
  var noDir=g.clinics.filter(function(c){return !c.director;});

  var h=pageHead(g.name, g.name+'　'+g.clinics.length+' 間院所',
    esc(g.note)+'<br>本組平均 <b>'+a.avg.toFixed(2)+'</b> 分（全院 '+allAvg.toFixed(2)+'），'
    +'評論 '+a.total.toLocaleString()+' 則，佔全院 '+Math.round(a.total/tot*100)+'%。');
  h+=proxyNote();

  h+='<div class="kpis">';
  h+='<div class="kpi k1"><div class="k">本組平均評分</div><div class="v">'+a.avg.toFixed(2)+'</div>'
   +'<div class="n">'+(a.avg>=allAvg?'高於':'低於')+'全院平均 '+Math.abs(a.avg-allAvg).toFixed(2)+' 分</div></div>';
  h+='<div class="kpi k2"><div class="k">評論總數</div><div class="v">'+a.total.toLocaleString()+'</div>'
   +'<div class="n">佔全院 '+Math.round(a.total/tot*100)+'%</div></div>';
  h+='<div class="kpi k3"><div class="k">評分最高</div><div class="v" style="font-size:1.5rem">'+esc(cs[cs.length-1].name)+'</div>'
   +'<div class="n">'+cs[cs.length-1].rating.toFixed(1)+' 分・'+cs[cs.length-1].count.toLocaleString()+' 則</div></div>';
  h+='<div class="kpi k4"><div class="k">最需關注</div><div class="v" style="font-size:1.5rem">'+esc(cs[0].name)+'</div>'
   +'<div class="n">'+cs[0].rating.toFixed(1)+' 分・'+cs[0].count.toLocaleString()+' 則</div></div>';
  h+='</div>';

  /* 彙整分析：全部由本組真實數字推導 */
  var pros=[], cons=[], acts=[];
  if(high.length) pros.push('本組 '+high.length+' 院評分達 4.5 以上（'+high.map(function(c){return c.name+' '+c.rating.toFixed(1);}).join('、')+'）');
  if(loud) pros.push('聲量最高的 '+loud.name+' 累積 '+loud.count.toLocaleString()+' 則評論並維持 '+loud.rating.toFixed(1)+' 分，是本組口碑主力');
  if(a.avg>=allAvg) pros.push('本組平均高於全院 '+ (a.avg-allAvg).toFixed(2) +' 分，服務流程可作為其他分組的取樣對象');
  if(!pros.length) pros.push('本組尚無明顯高分院所，建議先從流程盤點著手');

  if(low.length) cons.push('低於 4.3 分：'+low.map(function(c){return c.name+'（'+c.rating.toFixed(1)+'）';}).join('、'));
  if(loudLow.length) cons.push('高聲量低評分：'+loudLow.map(function(c){return c.name+'（'+c.rating.toFixed(1)+'／'+c.count.toLocaleString()+' 則）';}).join('、')+'，負評觸及人數最多');
  if(small.length) cons.push('評論樣本不足 50 則：'+small.map(function(c){return c.name+'（'+c.count+' 則）';}).join('、')+'，單則負評就能大幅拉低分數');
  if(g.id==='g1') cons.push('24 小時急診的等候時間與夜間人力，是這一組評論裡最常見的抱怨來源');
  if(g.id==='g3') cons.push('門市與醫療共用同一個 Google 頁面，且兩邊營業時間與公休日不同（百貨多為無休、醫療有固定公休），顧客常在醫療休診日到店而留下負評');
  if(g.id==='g2'){
    var rests=g.clinics.filter(function(c){return c.rest&&c.rest!=='無'&&c.rest!=='暫時歇業';});
    if(rests.length) cons.push('本組 '+rests.length+' 院有固定公休（'+rests.map(function(c){return c.name+' 休'+c.rest.replace(/週/g,'');}).join('、')+'），Google 上若未同步標註，易產生「白跑一趟」類負評');
  }
  var cl=g.clinics.filter(function(c){return c.status;});

function renderRanking(el){
  var all=allClinics();

  var byC=all.slice().sort(function(a,b){return b.count-a.count;});

      +'<td class="mono">'+rank(i)+'</td>'

      +'<th class="num">評分</th><th class="num">評論數</th><th>地區</th><th></th></tr></thead><tbody>'
      +list.map(row).join('')+'</tbody></table></div>'

          +'<div class="card-nm"><span class="mono">'+rank(i)+'</span>　'+esc(c.name)+'</div>'
          +'<div class="card-ad">'+c.group.name+'・'+esc(c.city)+'</div></div>'
          +'<div class="card-sc"><div class="n" style="color:'+scoreColor(c.rating)+'">'+c.rating.toFixed(1)+'</div>'
          +'<div class="c">'+c.count.toLocaleString()+' 則</div></div></div></div>';
      }).join('')+'</div>';
  }
  var h=pageHead('院所排行','14 間院所的評分與聲量排序',
    '「需優先關注」以 4.3 分為界，這是目前 14 院裡把體質差異切得最清楚的一條線。');

  h+=sect('聲量排行','評論則數，代表這個分數被多少人看到');

   +'重要紀錄請先匯出。'+fmtDate(BASE_SNAPSHOT_DATE)+' 那筆是內建基準，不會被清除。</div>';

async function startSync(){
  var btn=document.getElementById('syncBtn'), out=document.getElementById('syncOut');
  btn.disabled=true;
  var list=allClinics(), results={}, fails=[];
  out.innerHTML='<div class="prog"><i id="sf" style="width:0%"></i></div>'
    +'<div class="mono" id="st">準備中…</div><div class="log" id="sl"></div>';
  var log=document.getElementById('sl');
  for(var i=0;i<list.length;i++){
    var c=list[i], pct=Math.round(i/list.length*100);
    document.getElementById('sf').style.width=pct+'%';
    document.getElementById('st').textContent='進度 '+i+' / '+list.length+'（'+pct+'%）· 正在查 '+c.name;
    try{
      var s=await fetchClinicStats(c);
      results[c.placeId]={rating:s.rating,count:s.count,name:c.name};
      var d1=s.rating-c.baseRating, d2=s.count-c.baseCount;
      log.innerHTML+='<div>'+esc(c.name)+'　'+s.rating.toFixed(1)+' 分／'+s.count.toLocaleString()+' 則'
        +((d1||d2)?'　<span style="color:var(--ink-3)">較基準 '+(d1>=0?'+':'')+d1.toFixed(1)+' 分、'+(d2>=0?'+':'')+d2+' 則</span>':'')+'</div>';
    }catch(e){
      fails.push(c.name);
      results[c.placeId]={rating:c.baseRating,count:c.baseCount,name:c.name,failed:true};
      log.innerHTML+='<div style="color:var(--brand)">'+esc(c.name)+'　查詢失敗：'+esc(e.message)+'（沿用基準值）</div>';
    }
    log.scrollTop=log.scrollHeight;
    await new Promise(function(r){setTimeout(r,400);});
  }
  document.getElementById('sf').style.width='100%';
  document.getElementById('st').textContent='完成 '+list.length+' / '+list.length;
  var ok=list.length-fails.length, saved=false;
  if(ok>0){
    saved=saveSnapshot({date:todayStr(),source:'即時同步（'+ok+'/'+list.length+' 成功）',data:results});
    applyLatest(); updateHeader(); buildNav();
  }
  var msg;
  if(ok===0) msg='<div class="note warn">全部查詢都失敗，沒有存入快照。請檢查 Proxy 設定。</div>';
  else if(saved) msg='<div class="note ok">已存入 '+fmtDate(todayStr())+' 快照（'+ok+' 間成功'
    +(fails.length?'、'+fails.length+' 間失敗':'')+'）。可以到「評分變化」看比較。</div>';
  else msg='<div class="note warn"><strong>查到資料了，但存不進這台瀏覽器。</strong><br>'
    +'畫面數字已更新，關掉頁面就會消失。原因通常是瀏覽器停用網站儲存或使用無痕模式。'
    +'請改用一般視窗，並先按「匯出快照 JSON」保留這次結果。</div>';
  if(fails.length) msg+='<div class="note">查詢失敗：'+esc(fails.join('、'))+'</div>';
  out.innerHTML+=msg;
  btn.disabled=false;
}
function exportSnaps(){

     +'這個系統不會替你編造歷史數字。<br>先去跑一次同步，下個月再跑一次，這頁就會出現真實比較。</div>';

  if(!gTo  ||!snaps.some(function(s){return s.date===gTo;}))   gTo  =snaps[snaps.length-1].date;
  h+='<div class="panel" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:16px 20px">'
   +'<span style="font-size:.6rem;font-weight:700;letter-spacing:2px;color:var(--ink-3)">比較區間</span>'

   +'<span style="color:var(--ink-3)">→</span>'
   +'<select class="fld" id="gt">'+snaps.map(function(s){return '<option value="'+s.date+'"'+(s.date===gTo?' selected':'')+'>'+fmtDate(s.date)+'</option>';}).join('')+'</select>'
   +'<button class="btn btn-fill btn-sm" onclick="applyGrowth()">套用</button></div>';

function applyGrowth(){
  var f=document.getElementById('gf').value, t=document.getElementById('gt').value;
  if(f===t){alert('起迄日期不能相同，請選兩個不同的快照。');return;}
  if(f>t){var x=f;f=t;t=x;}
  gFrom=f; gTo=t;
  renderGrowth(document.getElementById('main'));
}

function diffBadge(d){

var REPORT_KEY='tzai_report_v2', LOCK_DAYS=7;
function getReport(){try{var r=localStorage.getItem(REPORT_KEY);return r?JSON.parse(r):null;}catch(e){return null;}}
function saveReport(d){try{localStorage.setItem(REPORT_KEY,JSON.stringify(d));return true;}catch(e){return false;}}
function lockLeft(iso){
  var diff=LOCK_DAYS*864e5-(Date.now()-new Date(iso).getTime());
  if(diff<=0)return 0;
  return {d:Math.floor(diff/864e5),h:Math.floor((diff%864e5)/36e5)};
}

  var cache=getReport();

  var rem=lockLeft(cache.scanDate);

  cache.groups.forEach(function(g){g.clinics.forEach(function(c){
    if(c.bad&&c.bad.length){totalBad+=c.bad.length;badClinics++;

  h+='<div class="kpi k3"><div class="k">有負評的院所</div><div class="v">'+badClinics+' <small>間</small></div><div class="n">共掃描 '+cache.scanned+' 間</div></div>';
  h+='<div class="kpi k2"><div class="k">無負評院所</div><div class="v">'+(cache.scanned-badClinics)+' <small>間</small></div><div class="n">最新 10 則皆 4 星以上</div></div>';
  h+='</div>';
  h+='<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0 4px">'
   +'<button class="btn btn-red" onclick="startScan()"'+(rem?' disabled':'')+'>重新掃描</button>';
  if(rem) h+='<span style="font-size:.72rem;color:var(--ink-2)">距離下次可掃描還有 '+rem.d+' 天 '+rem.h+' 小時（節省 API 額度）</span>'
    +'<button class="btn btn-line btn-sm" style="color:var(--brand)" onclick="if(confirm(\'解除鎖定並重新掃描？會再消耗一次 API 額度。\')){localStorage.removeItem(\''+REPORT_KEY+'\');showView(\'report\');}">解除鎖定</button>';
  h+='</div>';
  if(cache.failed&&cache.failed.length)
    h+='<div class="note">這次沒抓到資料的院所（結果不含它們）：'+esc(cache.failed.join('、'))+'</div>';

  if(totalBad===0){
    h+='<div class="note ok">本次掃描範圍內，各院最新 10 則評論都沒有 3 星以下負評。</div>';

          +'<div><span style="font-size:.92rem;font-weight:700">'+esc(c.name)+'</span>'
          +'<span style="font-size:.66rem;color:var(--ink-3);margin-left:9px">最新 10 則中有 '+c.bad.length+' 則</span></div>'
          +'<a class="btn btn-fill btn-sm" style="text-decoration:none" href="'+c.url+'" target="_blank" rel="noopener">前往回覆 ↗</a></div>';
        c.bad.forEach(function(r){
          var st='';
          for(var i=0;i<r.rating;i++)st+='★';

            +'<div style="margin-top:4px">'+(r.replied?'<span class="badge pos">已回覆</span>':'<span class="badge neg">未回覆</span>')+'</div></div></div>';
          h+= r.text ? '<div class="rev-tx" style="border-left:2px solid var(--brand);padding-left:12px">'+esc(r.text)+'</div>'
                     : '<div class="sm" style="font-style:italic">（顧客沒有留文字）</div>';
          h+='</div>';
        });
        h+='</div>';
      });
    });
  }
  el.innerHTML=h;
}
async function startScan(){
  var m=document.getElementById('main'), list=allClinics();
  m.innerHTML=pageHead('負評通報','掃描中','請不要關閉這個頁面。')
    +'<div class="panel"><div class="prog"><i id="rf" style="width:0%"></i></div>'
    +'<div class="mono" id="rt">準備中…</div><div class="mono" id="rc" style="margin-top:6px"></div></div>';
  var out=GROUPS.map(function(g){
    return {id:g.id,name:g.name,color:g.color,
      clinics:g.clinics.map(function(c){return {name:c.name,url:c.url,bad:[]};})};
  });
  var ok=0, fails=[];
  for(var i=0;i<list.length;i++){
    var cl=list[i], pct=Math.round(i/list.length*100);
    document.getElementById('rf').style.width=pct+'%';
    document.getElementById('rt').textContent='進度 '+i+' / '+list.length+'（'+pct+'%）';
    document.getElementById('rc').textContent='目前：'+cl.group.name+'・'+cl.name;
    try{
      var revs=await fetchClinicReviews(cl,10);
      var bad=revs.filter(function(r){return r.rating&&r.rating<=3;}).map(function(r){
        return {rating:r.rating,date:r.date||'',reviewer:(r.user&&r.user.name)||'匿名用戶',
          text:reviewText(r),replied:!!(r.response&&(r.response.snippet||r.response.text))};
      });
      var gg=out.filter(function(x){return x.id===cl.group.id;})[0];
      var cc=gg.clinics.filter(function(x){return x.name===cl.name;})[0];
      if(cc)cc.bad=bad;
      ok++;
    }catch(e){ fails.push(cl.name); }
    await new Promise(function(r){setTimeout(r,450);});
  }
  var data={scanDate:new Date().toISOString(),scanned:ok,failed:fails,groups:out};
  saveReport(data);
  renderReport(m);
}

function renderConclusion(el){
  var all=allClinics();
  var avg=all.reduce(function(a,c){return a+c.rating;},0)/all.length;
  var tot=all.reduce(function(a,c){return a+c.count;},0);
  var mains=all.filter(function(c){return c.group.id==='g1';});
  var rest=all.filter(function(c){return c.group.id!=='g1';});
  var mA=mains.reduce(function(a,c){return a+c.rating;},0)/mains.length;
  var rA=rest.reduce(function(a,c){return a+c.rating;},0)/rest.length;
  var mC=mains.reduce(function(a,c){return a+c.count;},0);
  var share=Math.round(mC/tot*100);
  var above45=all.filter(function(c){return c.rating>=4.5;});
  var below40=all.filter(function(c){return c.rating<4.0;});
  var gStats=GROUPS.map(function(g){return {g:g,a:rAvg(g)};}).sort(function(x,y){return y.a.avg-x.a.avg;});
  var avgCount=tot/all.length;
  var q1=all.filter(function(c){return c.rating>=avg&&c.count>=avgCount;});
  var q2=all.filter(function(c){return c.rating<avg&&c.count>=avgCount;});
  var q3=all.filter(function(c){return c.rating>=avg&&c.count<avgCount;});
  var q4=all.filter(function(c){return c.rating<avg&&c.count<avgCount;});
  var tiny=all.filter(function(c){return c.count<50;});

     +(ok2.length===closed.length

        : '請在 Google 商家後台標註暫停營業，避免顧客白跑後留下負評。下方統計仍包含這些院所。')

  h+='</div>';

  h+=sect('核心發現');
  h+='<div class="panel"><div style="font-size:1.02rem;font-weight:300;letter-spacing:1.5px;line-height:1.85;color:var(--ink)">'
   +'評分高低與<b style="font-weight:700;color:var(--brand)">營運型態</b>高度相關，不是個別院所的表現問題。'

function saveWorker(){
  var u=document.getElementById('wkUrl').value.trim().replace(/\/+$/,'');
  var k=document.getElementById('wkKey').value.trim();
  var msg=document.getElementById('wkMsg');
  if(u && !/^https?:\/\//.test(u)){
    msg.style.color='var(--brand)'; msg.textContent='位址要以 https:// 開頭。'; return;
  }
  if(u && !k){ msg.style.color='var(--brand)'; msg.textContent='請一併填入存取金鑰。'; return; }
  SETTINGS.workerUrl=u; SETTINGS.workerKey=k; saveSettings();
  msg.style.color='var(--ink-2)'; msg.textContent='正在連線…';
  loadLive().then(function(){
    buildNav();
    showView('settings');
  });
}
function clearWorker(){
  SETTINGS.workerUrl=''; SETTINGS.workerKey=''; saveSettings();
  LIVE=null; LIVE_ERR=null;
  allClinics().forEach(function(c){ c.rating=c.baseRating; c.count=c.baseCount; });
  applyLatest(); buildNav(); showView('settings');
}
function saveProxy(){
  var v=document.getElementById('pxUrl').value.trim(), msg=document.getElementById('setMsg');
  if(v&&!/^https?:\/\//.test(v)){msg.style.color='var(--brand)';msg.textContent='位址要以 http:// 或 https:// 開頭。';return;}
  SETTINGS.proxyUrl=v.replace(/\/+$/,''); saveSettings();
  msg.style.color='var(--pos)'; msg.textContent=v?'已儲存。':'已清除設定。';
  buildNav(); updateHeader();
}

  SETTINGS.proxyUrl=v; saveSettings(); msg.textContent='';
  out.innerHTML='<div style="display:flex;gap:9px;align-items:center;font-size:.76rem;color:var(--ink-2)">'
    +'<div class="spin" style="width:15px;height:15px"></div>正在用台北總院測試…</div>';
  try{
    var s=await fetchClinicStats(findClinic('tp-main'));
    out.innerHTML='<div class="note ok">連線成功。台北總院目前 '+s.rating.toFixed(1)+' 分／'+s.count.toLocaleString()+' 則評論。</div>';
    buildNav();
  }catch(e){
    out.innerHTML='<div class="note warn"><strong>連線失敗：'+esc(e.message)+'</strong><br>'
      +'檢查順序：<br>1. 位址是否正確、伺服器是否已啟動（免費方案首次喚醒約 30 秒）<br>'
      +'2. Proxy 回應是否帶 <code>Access-Control-Allow-Origin</code><br>'
      +'3. API 金鑰是否有效、額度是否還有<br>4. 路徑是否為 <code>/search</code></div>';
  }
}

/* ══════════════════════════════════════════════════════════
   院所詳情：即時評論
   ══════════════════════════════════════════════════════════ */
function closeDlg(){document.getElementById('dlg').classList.remove('on');}
document.getElementById('dlg').addEventListener('click',function(e){if(e.target===e.currentTarget)closeDlg();});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeDlg();});

async function openDlg(id){
  var c=findClinic(id); if(!c)return;
  document.getElementById('dlgT').textContent=c.name;
  document.getElementById('dlgS').textContent=c.group.name+'　'+(c.director?(c.dtitle||'院長')+' '+c.director+'　':'')
    +c.rating.toFixed(1)+' 分／'+c.count.toLocaleString()+' 則';
  var b=document.getElementById('dlgB');
  document.getElementById('dlg').classList.add('on');

  var info='<div class="tbl" style="margin-bottom:18px"><table><tbody>'
   +'<tr><th style="width:110px">院所全名</th><td>'+esc(c.full||c.name)+'</td></tr>'
   +(c.status?'<tr><th>營運狀態</th><td><span class="badge neg">'+esc(c.status)+'</span></td></tr>':'')
   +'<tr><th>'+esc(c.dtitle||'院長')+'</th><td>'+(c.director?'<b>'+esc(c.director)+'</b>':'<span class="badge neu">待補</span>')+'</td></tr>'
   +(c.deputy?'<tr><th>其他主管</th><td>'+esc(c.deputy)+'</td></tr>':'')
   +'<tr><th>分組／區域</th><td>'+esc(c.group.name)+'　'+esc(c.zone||'')+'部</td></tr>'
   +'<tr><th>類型</th><td>'+esc(c.tag)+'</td></tr>'
   +'<tr><th>地址</th><td>'+esc(c.addr)+'</td></tr>'
   +'<tr><th>電話</th><td>'+esc(c.tel)+'</td></tr>'
   +'<tr><th>營業時間</th><td>'+esc(c.hours)
     +(c.ghours&&c.ghours!==c.hours?'<div class="sm" style="color:#8E1220">Google 顯示：'+esc(c.ghours)+'</div>':'')+'</td></tr>'
   +'<tr><th>公休</th><td>'+esc(c.rest||'—')
     +(c.grest&&c.grest!==c.rest?'<div class="sm" style="color:#8E1220">Google 顯示：'+esc(c.grest)+'</div>':'')+'</td></tr>'
   +'<tr><th>登記名稱</th><td class="sm">'+esc(c.entity||'')+'</td></tr>'
   +'<tr><th>Google 標示</th><td class="sm">'+esc(c.gname||c.name)+'</td></tr>'
   +'<tr><th>Google</th><td><a class="link" href="'+c.url+'" target="_blank" rel="noopener">開啟評論頁 ↗</a></td></tr>'
   +'</tbody></table></div>';

  if(!hasProxy()){
    b.innerHTML=info+'<div class="note">要抓即時評論，先到系統設定填入 Proxy 位址。'
      +'目前顯示的是 '+fmtDate(BASE_SNAPSHOT_DATE)+' 實查的基準資料：'
      +c.rating.toFixed(1)+' 分、'+c.count.toLocaleString()+' 則。</div>'
      +'<button class="btn btn-fill" onclick="closeDlg();showView(\'settings\')">前往系統設定</button>';
    return;
  }
  b.innerHTML='<div class="load"><div class="spin"></div>'
    +'<div class="mono">正在向 Google 取得 '+esc(c.name)+' 的最新評論…</div></div>';
  try{
    var revs=await fetchClinicReviews(c,20);
    if(!revs.length){
      b.innerHTML=info+'<div class="note">這間院所沒有抓到文字評論。可能是 API 尚未涵蓋，或該院評論皆為純星等。</div>';
      return;
    }
    renderDlg(c,revs,analyzeReviews(revs),info);
  }catch(err){
    b.innerHTML=info+'<div class="note warn"><strong>抓取失敗：'+esc(err.message)+'</strong><br>'
      +'常見原因：Proxy 位址填錯、伺服器休眠中（免費方案首次喚醒約 30 秒）、API 額度用完，'
      +'或 Proxy 沒開 CORS。</div>';
  }
}
function renderDlg(c,revs,an,info){
  document.getElementById('dlgS').textContent=c.group.name+'　已抓取 '+an.total+' 則最新評論　正 '+an.pos+'／中 '+an.neu+'／負 '+an.neg;
  var h='<div style="font-size:.63rem;color:var(--ink-3);letter-spacing:1.2px;margin-bottom:14px">'
   +'GOOGLE MAPS 真實評論・抓取時間 '+new Date().toLocaleString('zh-TW')+'</div>';
  h+='<div class="tabs">'
   +'<div class="tab on" onclick="swTab(this,\'t-all\')">全部 '+an.total+'</div>'
   +'<div class="tab" onclick="swTab(this,\'t-pos\')">正評 '+an.pos+'</div>'
   +'<div class="tab" onclick="swTab(this,\'t-neu\')">中性 '+an.neu+'</div>'
   +'<div class="tab" onclick="swTab(this,\'t-neg\')">負評 '+an.neg+'</div>'
   +'<div class="tab" onclick="swTab(this,\'t-sum\')">分析摘要</div>'
   +'<div class="tab" onclick="swTab(this,\'t-inf\')">院所資料</div></div>';
  function list(items){
    return items.length ? items.map(revCard).join('')
      : '<div style="padding:28px;text-align:center;color:var(--ink-3);font-size:.8rem">這個分類目前沒有評論。</div>';
  }
  h+='<div id="t-all">'+list(an.items)+'</div>';
  h+='<div id="t-pos" style="display:none">'+list(an.items.filter(function(i){return i.sentiment==='positive';}))+'</div>';
  h+='<div id="t-neu" style="display:none">'+list(an.items.filter(function(i){return i.sentiment==='neutral';}))+'</div>';
  h+='<div id="t-neg" style="display:none">'+list(an.items.filter(function(i){return i.sentiment==='negative';}))+'</div>';
  h+='<div id="t-inf" style="display:none">'+info+'</div>';

  h+='<div id="t-sum" style="display:none">';
  h+='<div class="panel"><h4 style="font-size:.6rem;font-weight:700;letter-spacing:2px;color:var(--maroon);margin-bottom:5px">'
   +'評論關鍵字</h4><div style="font-size:.68rem;color:var(--ink-3);margin-bottom:16px">'
   +'由這 '+an.total+' 則評論實際計算。數字＝出現於幾則評論。正評關鍵字取自 4–5 星，負評關鍵字取自 1–3 星。</div>';
  h+='<div style="margin-bottom:14px"><div style="font-size:.66rem;font-weight:700;color:var(--pos);margin-bottom:8px">正評關鍵字</div>'
   +(an.posKw.length?an.posKw.map(function(k){return '<span class="kw p">'+esc(k.word)+'<i>×'+k.n+'</i></span>';}).join('')
     :'<span class="sm">這批評論沒有出現追蹤中的正評詞。</span>')+'</div>';
  h+='<div><div style="font-size:.66rem;font-weight:700;color:#9A0F22;margin-bottom:8px">負評關鍵字</div>'
   +(an.negKw.length?an.negKw.map(function(k){return '<span class="kw n">'+esc(k.word)+'<i>×'+k.n+'</i></span>';}).join('')
     :'<span class="sm">這批評論沒有出現追蹤中的負評詞。</span>')+'</div></div>';

  var pl=an.posKw.slice(0,4).map(function(k){return '顧客常提到「'+k.word+'」（'+k.n+' 則）';});
  if(!pl.length) pl=['這批評論沒有集中出現的正面詞，可再擴大抓取範圍。'];
  var nl=an.negKw.slice(0,4).map(function(k){return '顧客常抱怨「'+k.word+'」（'+k.n+' 則）';});
  if(!nl.length) nl=['這批評論沒有集中出現的負面詞。'];
  var al=an.negKw.slice(0,3).map(function(k){return '針對「'+k.word+'」建立處理流程並指派負責人';});
  al.push('在 Google 後台逐則回覆這 '+an.neg+' 則負評，回覆後追蹤是否修改評分');
  h+='<div class="tri"><div class="p"><h4>正評重點</h4><ol>'+pl.map(function(t){return '<li>'+esc(t)+'</li>';}).join('')+'</ol></div>'
   +'<div class="c"><h4>負評重點</h4><ol>'+nl.map(function(t){return '<li>'+esc(t)+'</li>';}).join('')+'</ol></div>'
   +'<div class="a"><h4>建議行動</h4><ol>'+al.map(function(t){return '<li>'+esc(t)+'</li>';}).join('')+'</ol></div></div>';
  h+='<div class="panel"><h4 style="font-size:.6rem;font-weight:700;letter-spacing:2px;color:var(--maroon);margin-bottom:10px">'
   +'這批評論的實際分布</h4><div style="font-size:.79rem;line-height:1.9">'
   +'最新 '+an.total+' 則裡，4–5 星 '+an.pos+' 則（'+an.posRate+'%）、3 星 '+an.neu+' 則、1–2 星 '+an.neg+' 則。'
   +'院所目前 Google 總體評分 '+c.rating.toFixed(1)+' 分、累計 '+c.count.toLocaleString()+' 則。'
   +(an.posRate>=80?'近期評論以正面為主。':an.posRate>=60?'近期評論偏正面，但仍有可處理的負評。':'近期負評比例偏高，建議優先介入。')
   +'</div></div></div>';
  document.getElementById('dlgB').innerHTML=h;
}
function revCard(it){
  var rv=it.raw, u=rv.user||{};
  var col=it.stars>=4?'var(--gold)':it.stars===3?'var(--orange)':'var(--brand)';
  var st='';
  for(var i=0;i<it.stars;i++)st+='★';
  for(var j=it.stars;j<5;j++)st+='☆';
  var meta=[];
  if(u.local_guide)meta.push('在地嚮導');
  if(u.reviews)meta.push(u.reviews+' 則評論');
  var badge=it.sentiment==='positive'?'<span class="badge pos">正評</span>'
    :it.sentiment==='neutral'?'<span class="badge neu">中性</span>':'<span class="badge neg">負評</span>';
  var h='<div class="rev '+it.sentiment+'">';
  h+='<div class="rev-hd"><div><div class="rev-au">'+esc(u.name||'匿名用戶')+'</div>'
   +'<div class="rev-mt">'+esc(meta.join('・'))+'</div></div>'
   +'<div class="rev-rt"><div class="rev-st" style="color:'+col+'">'+st+'</div>'
   +'<div class="rev-dt">'+esc(rv.date||'')+'</div><div style="margin-top:4px">'+badge+'</div></div></div>';
  h+='<div class="rev-tx">'+esc(it.text||'（此評論沒有文字內容）')+'</div>';
  if(it.pos.length||it.neg.length){
    h+='<div class="rev-an">';
    if(it.pos.length)h+='<span><b>正面詞</b>　'+esc(it.pos.join('、'))+'</span>';
    if(it.neg.length)h+='<span><b>負面詞</b>　'+esc(it.neg.join('、'))+'</span>';
    h+='</div>';
  }
  if(rv.response&&(rv.response.snippet||rv.response.text)){
    h+='<div class="rev-an"><span><b>院方回覆</b>　'+esc(rv.response.snippet||rv.response.text)+'</span></div>';
  }
  h+='</div>';
  return h;
}
function swTab(el,id){
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('on');});
  el.classList.add('on');
  ['t-all','t-pos','t-neu','t-neg','t-sum','t-inf'].forEach(function(t){
    var e=document.getElementById(t); if(e)e.style.display=(t===id?'':'none');
  });
}

/* ══════════════════════════════════════════════════════════
   啟動
   ══════════════════════════════════════════════════════════ */
(function init(){
  var lg=document.getElementById('mhLogo');
  if(lg) lg.src='data:image/png;base64,'+LOGO_B64;
  applyLatest();
  buildNav();
  showView('overview');
  if(hasWorker()){
    loadLive().then(function(){
      buildNav();
      showView(CURRENT.view, CURRENT.gid);
    });
    /* 開著頁面時每 10 分鐘自動重讀一次（排程器是每小時掃描） */
    setInterval(function(){
      if(document.visibilityState==='visible'){
        loadLive(true).then(function(){ updateHeader(); });
      }
    }, 10*60*1000);
  }
})();
</script>
